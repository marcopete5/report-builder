[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

# Handy: map /api/* to functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/report/weekly"
  to = "/.netlify/functions/report-weekly"
  status = 200


[[redirects]]
  from = "/api/lesson-feedback"
  to = "/.netlify/functions/lesson-feedback"
  status = 200

# Google Ads scheduled sync - runs daily at 2 AM UTC
[functions."google-ads-sync"]
  schedule = "0 2 * * *"

# Admissions Airtable sync - runs daily at 3 AM UTC
[functions."sync-admissions-airtable"]
  schedule = "0 3 * * *"

# Student sync from lesson entries - runs daily at 3:30 AM UTC
# Creates student records for new students who have submitted work
[functions."sync-students"]
  schedule = "30 3 * * *"

# Student data refresh from Airtable - runs daily at 4 AM UTC
# Updates Education Dashboard, Weekly Report, Student Detail pages
[functions."refresh-airtable"]
  schedule = "0 4 * * *"
