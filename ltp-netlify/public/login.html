<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LTP Reports - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo h1 {
            font-size: 28px;
            color: #2d3748;
            margin-bottom: 8px;
        }
        .logo p {
            color: #718096;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #2d3748;
            font-weight: 500;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 12px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #5568d3;
        }
        .btn:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
        }
        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        .error.show {
            display: block;
        }
        .success {
            background: #c6f6d5;
            color: #276749;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        .success.show {
            display: block;
        }
        .tab-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 16px;
            background: #e2e8f0;
            color: #4a5568;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: #667eea;
            color: white;
        }
        .form-container {
            display: none;
        }
        .form-container.active {
            display: block;
        }
        .toggle-text {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #718096;
        }
        .toggle-text a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .toggle-text a:hover {
            text-decoration: underline;
        }
        .help-text {
            font-size: 12px;
            color: #718096;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <h1>LTP Reports</h1>
            <p id="subtitle">Please sign in to continue</p>
        </div>

        <div class="tab-buttons">
            <button class="tab-btn active" onclick="showTab('login')">Sign In</button>
            <button class="tab-btn" onclick="showTab('signup')">Sign Up</button>
        </div>

        <div id="error" class="error"></div>
        <div id="success" class="success"></div>

        <!-- Login Form -->
        <div id="login-form-container" class="form-container active">
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" required>
                </div>

                <button type="submit" class="btn" id="login-btn">Sign In</button>

                <div class="toggle-text">
                    <a href="#" onclick="showForgotPassword(); return false;">Forgot password?</a>
                </div>
            </form>
        </div>

        <!-- Forgot Password Form -->
        <div id="forgot-form-container" class="form-container">
            <form id="forgot-form">
                <div class="form-group">
                    <label for="forgot-email">Email</label>
                    <input type="email" id="forgot-email" name="email" required autofocus>
                    <div class="help-text">Enter your email to receive a password reset link</div>
                </div>

                <button type="submit" class="btn" id="forgot-btn">Send Reset Link</button>

                <div class="toggle-text">
                    <a href="#" onclick="showTab('login'); return false;">← Back to Login</a>
                </div>
            </form>
        </div>

        <!-- Signup Form -->
        <div id="signup-form-container" class="form-container">
            <form id="signup-form">
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" name="password" required minlength="8">
                    <div class="help-text">Minimum 8 characters</div>
                </div>

                <div class="form-group">
                    <label for="signup-studentId">Student ID</label>
                    <input type="text" id="signup-studentId" name="studentId" required placeholder="recXXXXXXXXXXXXXX">
                    <div class="help-text">Your Airtable student ID (provided by your instructor)</div>
                </div>

                <button type="submit" class="btn" id="signup-btn">Create Account</button>
            </form>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const forgotForm = document.getElementById('forgot-form');
        const errorDiv = document.getElementById('error');
        const successDiv = document.getElementById('success');
        const loginBtn = document.getElementById('login-btn');
        const signupBtn = document.getElementById('signup-btn');
        const forgotBtn = document.getElementById('forgot-btn');

        // Tab switching
        function showTab(tab) {
            const tabs = document.querySelectorAll('.tab-btn');
            const containers = document.querySelectorAll('.form-container');

            tabs.forEach(t => t.classList.remove('active'));
            containers.forEach(c => c.classList.remove('active'));

            if (tab === 'login') {
                tabs[0].classList.add('active');
                document.getElementById('login-form-container').classList.add('active');
                document.getElementById('subtitle').textContent = 'Please sign in to continue';
            } else {
                tabs[1].classList.add('active');
                document.getElementById('signup-form-container').classList.add('active');
                document.getElementById('subtitle').textContent = 'Create your student account';
            }

            clearMessages();
        }

        function showForgotPassword() {
            const tabs = document.querySelectorAll('.tab-btn');
            const containers = document.querySelectorAll('.form-container');

            tabs.forEach(t => t.classList.remove('active'));
            containers.forEach(c => c.classList.remove('active'));

            document.getElementById('forgot-form-container').classList.add('active');
            document.getElementById('subtitle').textContent = 'Reset your password';
            clearMessages();
        }

        function clearMessages() {
            errorDiv.classList.remove('show');
            errorDiv.textContent = '';
            successDiv.classList.remove('show');
            successDiv.textContent = '';
        }

        // Login form handler
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMessages();

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';

            try {
                const response = await fetch('/.netlify/functions/auth-login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Login failed');
                }

                localStorage.setItem('auth_token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                window.location.href = '/';
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.classList.add('show');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        });

        // Signup form handler
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMessages();

            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const studentId = document.getElementById('signup-studentId').value;

            signupBtn.disabled = true;
            signupBtn.textContent = 'Creating account...';

            try {
                const response = await fetch('/.netlify/functions/auth-signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password, studentId })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Signup failed');
                }

                // Store token in localStorage
                localStorage.setItem('auth_token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                // Show success message briefly, then redirect
                successDiv.textContent = data.message || 'Account created successfully!';
                successDiv.classList.add('show');

                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.classList.add('show');
                signupBtn.disabled = false;
                signupBtn.textContent = 'Create Account';
            }
        });

        // Forgot password form handler
        forgotForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMessages();

            const email = document.getElementById('forgot-email').value;

            forgotBtn.disabled = true;
            forgotBtn.textContent = 'Sending...';

            try {
                const response = await fetch('/.netlify/functions/auth-reset-request', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to send reset link');
                }

                // Show success message
                successDiv.innerHTML = data.message + (data.dev ? `<br><br><small>Dev Mode: <a href="${data.dev.resetUrl}" style="color: #276749; text-decoration: underline;">Reset Password Link</a></small>` : '');
                successDiv.classList.add('show');
                forgotForm.style.display = 'none';

            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.classList.add('show');
                forgotBtn.disabled = false;
                forgotBtn.textContent = 'Send Reset Link';
            }
        });
    </script>
</body>
</html>
